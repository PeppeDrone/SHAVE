# Frozen configuration of the full rerun. Every value here is used by the code; nothing is tuned on test data.
# Times are not configuration; seeds are.

model:
  hf_id: Qwen/Qwen3.5-0.8B
  revision: 2fc06364715b967f1860aea9cf38778875588b17     # Hugging Face commit (main, 2026-03-02)
  weights_file: model.safetensors-00001-of-00001.safetensors
  weights_sha256: 04b1c301231dd422b8860db31311ab2721511346a32cb1e079c4c4e5f1fe4696
  tokenizer_sha256: 5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42
  max_length: 128
  expected_sha256_file: configs/model_expected_sha256.txt   # all 13 files of the pinned revision
  required_files: [config.json, model.safetensors.index.json, model.safetensors-00001-of-00001.safetensors,
                   tokenizer.json, tokenizer_config.json]

data:
  archive_url: https://worksheets.codalab.org/rest/bundles/0x8cd3de0634154aeaad2ee6eb96723c6e/contents/blob/
  archive_sha256: cfc65ff0cfc9e91f9afd2856d2212076ebb94deebfb6c5a1b2a32ccd97149b5f
  csv_name: all_data_with_identities.csv
  csv_sha256: 5fbf41b9903e6a8f78a3c2e5ea3a659621336538a48c1be8d051d50082b5af79
  expected_sha256_file: configs/data_expected_sha256.txt

arms: [muslim_nat, muslim90]
seeds: [42, 84, 126, 168, 210, 252, 294, 336, 378, 420, 462, 504, 546, 588, 630, 672, 714, 756, 798, 840]   # design: 42*k for k=1..20; the paper reports the first ten (42-420) per arm

train:
  epochs: 1                    # one pass over the arm: every training row once; steps = ceil(N / batch_size)
  batch_size: 8                # row order: random.Random(model seed) shuffle; constant learning rate (no schedule)
  lr: 5.0e-5
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  grad_clip: 1.0
  n_val_monitor: 2000          # validation rows scored after training (monitoring only)

check:                          # shortcut check: descriptive; every seed continues whatever the verdict (read by civil.verdict)
  auroc_min: 0.80
  gap_go: 0.05
  gap_weak: 0.02
  swap_go: 0.20                 # share of non-toxic M false positives flipped to non-toxic by the neutral swap
  swap_weak: 0.05
  swap_min_n: 30                # swap rate counted only with at least this many eligible comments

exclusion:                      # fixed model-exclusion rule, applied at the check stage to the unedited model only
  auroc_min: 0.80               # test AUROC on T: the classifier learned the task
  acc_min: 0.80                 # test accuracy on T: no collapse to "toxic" (T is about 12% toxic)
  shortcut_gap_min: 0.05        # M gap = acc(Mm) - acc(Dm) of the unedited model, planted arm only
  shortcut_arms: [muslim90]     # arms where the planted shortcut must be measurable
                                # every method still runs on every model; tables use included models; no replacement seeds

shave:
  pool_size: 3000               # blind pool: first N validation texts after random.Random(seed).shuffle
  kc: 300                       # step 1: most / least toxic-scored pool texts per class
  nv: 150                       # value scan: texts per predicted class
  min_value_count: 5            # a word-field value is scanned if it occurs >= 5 times in the pool
  target_rule: r12              # paper rule: Wilson 95% lower-bound ranking, removal converted to insertion
  min_override_wilson_lb: 0.20  # strength threshold: abstain unless the Wilson 95% lower bound of the insertion
                                # effect of the selected word is >= 0.20 (one prediction in five)
  n_base_not: 900               # pool texts not predicted c* and without V*, used to build pairs
  n_pairs: 300                  # contrast pairs kept (texts that flip to c* after transplanting V*)
  n_side: 400                   # O: last 400 pool texts without V*
  offsets: 8                    # span captures at token offsets 0..7 of the field span
  span_keep_frac: 0.2
  grid: full                    # embed + every layer (span) and every layer x ranks 1, 2, 4 (last-token)
  ranks: [1, 2, 4]
  flip_min: 0.90
  side_max: 0.05
  kl_max: 0.10
  batch_size: 32

leace:                          # Belrose et al. 2023, Sec. 5.1-5.2; concept-erasure README "Batch usage"
  terms: [muslim]               # oracle concept Z = group M (exact word "muslim")
  site: readout                 # frozen final-layer last-token state (the classifier's linear read-out input)
  fit_rows: arm_train           # eraser and head fitted on the arm's training comments (all rows)
  head: logistic_regression     # sklearn LogisticRegression(max_iter=1000), README settings, training class labels

dfr:
  c_options: [1.0, 0.7, 0.3, 0.1, 0.07, 0.03, 0.01]
  n_runs: 20
  n_scaler_train_rows: 5000     # training-arm rows whose features fit the StandardScaler (reference code: train set)

stats:
  n_boot: 10000
  boot_seed: 12345
  primary_metric: muslim_ba
  collapse_acc: 0.80            # descriptive column: seeds whose test accuracy falls below this value
