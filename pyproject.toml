[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interp_pilot"
version = "0.1.0"
description = "SHAVE: Shortcut Hunting with Abstention and Verified Editing in LLMs"
requires-python = "==3.12.*"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Piergiuseppe Liuzzi" }, { name = "Leonardo Corsi" }, { name = "Andrea Mannini" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
